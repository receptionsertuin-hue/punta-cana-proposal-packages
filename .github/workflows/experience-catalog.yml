name: Experience catalog checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/experience-catalog.test.cjs'
      - 'next.config.ts'
      - 'package*.json'
      - '.github/workflows/experience-catalog.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/experience-catalog.test.cjs
      - run: npx tsc --noEmit
      - run: npx eslint src/components/ExperienceCatalog src/sanity/schemaTypes/ExperienceCatalog src/sanity/queries/ProposalPackages/catalog.ts
